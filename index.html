<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roshan CRM</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#113837">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F7F9F4; --surface:#FFFFFF; --surface-2:#FBFCF9;
  --ink:#123E3C; --text:#2A3B3A; --muted:#677675; --faint:#97A3A2;
  --line:#E2E8E1; --line-2:#EDF1EC;
  --brand:#17494A; --brand-hover:#0F3B3C; --brand-deep:#113837; --brand-card:#1B4746;
  --accent:#4DB848; --accent-ink:#2E8F33; --accent-soft:#E9F6E7;
  --danger:#C2413B; --danger-soft:#FBEAE9; --warn:#C98A12; --warn-soft:#FCF3E1;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 30px -12px rgba(18,62,60,.18);
  --shadow-sm:0 2px 8px -2px rgba(18,62,60,.10);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{color:var(--ink);margin:0;letter-spacing:-.02em;line-height:1.15}
.script{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);letter-spacing:-.01em;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.dot{color:var(--accent)}
.eyebrow{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface)}
.muted{color:var(--muted)} .small{font-size:12.5px} .nowrap{white-space:nowrap}
.hidden{display:none!important}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none;font-size:14px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 8px 20px -10px rgba(23,73,74,.6)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);}
.btn-green{background:var(--accent);color:#fff}
.btn-danger{background:var(--surface);border-color:#F0C9C6;color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-xs{padding:4px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field label .req{color:var(--danger)}
.input,select.input,textarea.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;transition:.15s}
.input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(77,184,72,.15)}
textarea.input{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;max-width:1240px;margin:0 auto;padding:40px 28px}
.login h1{font-size:clamp(38px,5.2vw,64px);font-weight:700;letter-spacing:-.045em}
.login .lead{font-size:17px;color:var(--muted);max-width:520px;margin:22px 0 26px}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.ticks li{display:flex;gap:12px;align-items:center;color:var(--ink);font-weight:500}
.tick{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}
.logo{font-weight:700;font-size:24px;letter-spacing:-.03em;color:var(--ink)}
.progress{height:4px;background:var(--line-2);border-radius:9px;overflow:hidden;margin:12px 0 20px}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:9px}
.demo-roles{display:grid;gap:10px}
.demo-role{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer;transition:.15s}
.demo-role:hover{border-color:var(--brand);background:#fff}
.demo-role b{color:var(--ink);display:block}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.avatar.sm{width:28px;height:28px;font-size:11px}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--brand-deep);color:#CFE0DE;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.sidebar .logo{color:#fff;padding:0 10px 4px;display:flex;align-items:baseline;gap:8px}
.sidebar .logo small{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--accent);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:2px 8px}
.ws{margin:16px 6px 10px;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04)}
.ws label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8FB0AD;font-weight:700}
.ws select{width:100%;background:transparent;border:0;color:#fff;font-weight:600;padding:4px 0 0;outline:none;cursor:pointer}
.ws select option{color:#123E3C}
.ws .ws-name{color:#fff;font-weight:600;margin-top:2px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6F9592;font-weight:700;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:#CFE0DE;text-decoration:none;font-weight:500;cursor:pointer;transition:.12s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--brand-card);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.nav a.active svg{color:var(--accent)}
.nav a .count{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{color:#fff;display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:11.5px;color:#8FB0AD}
.side-foot .icon-btn{background:transparent;border-color:rgba(255,255,255,.15);color:#CFE0DE}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(247,249,244,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:22px;font-weight:700}
.topbar .menu-btn{display:none}
.demo-pill{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 10px}
.content{padding:26px 28px 60px;max-width:1400px;width:100%}

/* ---------- Panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-h h3{font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .k-label{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .k-val{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.03em;margin-top:4px}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.kpi.dark{background:var(--brand-deep);border-color:var(--brand-deep)}
.kpi.dark .k-label,.kpi.dark .k-sub{color:#9DBDBA}.kpi.dark .k-val{color:#fff}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.cols-eq{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stack{display:grid;gap:18px;align-content:start}
.cols,.cols-eq{align-items:start}

/* ---------- Tables ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.t td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:#F6FAF4}
.t .name{font-weight:600;color:var(--ink)}
.t .sub{font-size:12.5px;color:var(--muted)}
.t input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h4{font-size:17px;margin-bottom:6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:#E7F0F8;color:#2C6CA8}
.s-contacted{background:#E6F2F1;color:#1F6E6A}
.s-interested{background:#FCF3E1;color:#A86F07}
.s-follow_up{background:#EFEAFB;color:#6A49C4}
.s-won{background:var(--accent-soft);color:var(--accent-ink)}
.s-lost{background:var(--danger-soft);color:var(--danger)}
.s-not_interested{background:#EFF1F0;color:#6B7675}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:var(--surface-2)}
.tag.overdue{color:var(--danger);border-color:#F0C9C6;background:var(--danger-soft)}
.tag.today{color:var(--warn);border-color:#F1DDB0;background:var(--warn-soft)}

/* filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{width:auto;min-width:150px;padding:9px 12px}
.toolbar .search{min-width:240px;flex:1;max-width:360px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text)}
.chip b{color:var(--ink);margin-left:4px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on b{color:#fff}
.bulkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--brand-deep);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px}
.bulkbar select{background:var(--brand-card);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:6px 10px}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line-2);font-size:13px;color:var(--muted)}

/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:10px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--brand);border-radius:99px}
.bar-fill.g{background:var(--accent)}
.vchart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.vchart .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vchart .vb span{width:100%;max-width:34px;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:2px}
.vchart .vb:last-child span{background:var(--accent)}
.vchart .vb small{font-size:10.5px;color:var(--faint)}

/* list items */
.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line-2);cursor:pointer}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{color:var(--ink);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Drawer & modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,30,29,.38);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:51;box-shadow:-20px 0 60px -20px rgba(0,0,0,.3);display:flex;flex-direction:column;animation:slide .2s ease-out}
.drawer-h{padding:20px 22px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-b{padding:20px 22px;overflow-y:auto;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 28px));max-height:calc(100vh - 40px);overflow-y:auto;background:var(--surface);border-radius:22px;z-index:52;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{width:min(820px,calc(100% - 28px))}
.modal h3{font-size:20px;margin-bottom:4px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:.4}}@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;font-size:13px}
.act:hover{border-color:var(--accent)}
.act svg{width:20px;height:20px;color:var(--accent-ink)}
.timeline{display:grid;gap:0;position:relative}
.tl{display:flex;gap:12px;padding:10px 0;position:relative}
.tl .ic{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.tl .ic svg{width:14px;height:14px}
.tl b{color:var(--ink);font-weight:600}
.status-grid{display:flex;flex-wrap:wrap;gap:8px}
.status-grid .pill{cursor:pointer;padding:6px 12px;border:1px solid transparent}
.status-grid .pill.sel{border-color:currentColor;box-shadow:0 0 0 2px rgba(255,255,255,1),0 0 0 3px currentColor}
.section-t{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}

/* upload */
.drop{border:2px dashed var(--line);border-radius:18px;padding:34px;text-align:center;background:var(--surface);cursor:pointer;transition:.15s}
.drop:hover,.drop.drag{border-color:var(--accent);background:#FAFDF8}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--faint)}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:#fff}
.step.on{color:var(--ink)}.step.on .n{background:var(--brand);border-color:var(--brand);color:#fff}
.step.done .n{background:var(--accent);border-color:var(--accent);color:#fff}
.mode{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.mode.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(23,73,74,.08)}
.mode input{margin-top:3px;accent-color:var(--brand)}
.mode b{color:var(--ink)}
.dist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dist{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;gap:10px;align-items:center}
.dist b{font-size:20px;color:var(--ink);display:block;line-height:1}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0F2E2D;color:#CDE7E3;border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.55}
.copy-row{display:flex;gap:8px;align-items:center}
.copy-row .input{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.switch{position:relative;width:40px;height:22px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD5D3;border-radius:99px;cursor:pointer;transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.note{background:var(--accent-soft);border:1px solid #CFEBCB;color:#24572A;border-radius:14px;padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--warn-soft);border-color:#F1DDB0;color:#7A560C}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-weight:500;box-shadow:var(--shadow);animation:pop2 .2s}
.toast.err{background:var(--danger)}
@keyframes pop2{from{transform:translateY(10px);opacity:0}}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.cols,.cols-eq{grid-template-columns:1fr}}
@media (max-width:900px){
  .login{grid-template-columns:1fr;gap:28px;padding:28px 16px}
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.3)}
  .topbar{padding:12px 16px}.topbar .menu-btn{display:inline-flex}
  .topbar h2{font-size:18px}
  .content{padding:18px 16px 60px}
  .grid2,.grid3{grid-template-columns:1fr}
  .toolbar .search{max-width:none;min-width:100%}
  /* tables become cards */
  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody,table.t.cards tr,table.t.cards td{display:block;width:100%}
  table.t.cards tr{padding:12px 14px;border-bottom:1px solid var(--line-2);position:relative}
  table.t.cards td{border:0;padding:3px 0}
  table.t.cards td[data-l]::before{content:attr(data-l)": ";font-size:12px;color:var(--faint)}
  table.t.cards td.sno{display:none}
  table.t.cards td.cb{position:absolute;right:14px;top:14px;width:auto}
  .actions{grid-template-columns:repeat(3,1fr)}
  .bar-row{grid-template-columns:90px 1fr 40px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>/* =====================================================================
   Roshan CRM — data layer
   Two interchangeable back-ends with the SAME methods:
     • SupaAPI  – real database (Supabase), used when config has a URL
     • DemoAPI  – in-browser demo with sample data (for pitching / trying)
   ===================================================================== */
const STATUSES = [
  ['new','Open'],['contacted','Contacted'],['interested','Interested'],['follow_up','Follow-up'],
  ['won','Won'],['lost','Lost'],['not_interested','Not interested']];
const STATUS_LABEL = Object.fromEntries(STATUSES);
const SOURCE_KINDS = [['website','Website form'],['facebook','Facebook Lead Ads'],['google','Google Ads'],
  ['indiamart','IndiaMART'],['tradeindia','TradeIndia'],['justdial','JustDial'],['api','Custom API'],['other','Other']];

const nowISO = () => new Date().toISOString();

/* ---------------------------------------------------------------- DEMO */
const DEMO_KEY = 'roshan_crm_demo_v1';
function makeSeed() {
  const first = ['Aarav','Vivaan','Aditya','Ishaan','Rohan','Kabir','Arjun','Sai','Ananya','Diya','Priya','Neha','Pooja','Sneha','Kavya','Meera','Rahul','Amit','Vikram','Sanjay','Ritu','Nisha','Karan','Manish','Deepak','Simran','Tanvi','Harsh','Yash','Ayesha','Farhan','Gurpreet','Lakshmi','Suresh','Anjali'];
  const last = ['Sharma','Verma','Gupta','Singh','Patel','Reddy','Iyer','Nair','Mehta','Kapoor','Joshi','Malhotra','Chopra','Bansal','Agarwal','Khan','Das','Rao','Pillai','Saxena'];
  const cities = ['New Delhi','Gurugram','Noida','Mumbai','Pune','Bengaluru','Jaipur','Lucknow','Chandigarh','Hyderabad','Ahmedabad','Indore'];
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const t0 = Date.now();
  const s = { orgs:[], users:[], leads:[], acts:[], sources:[], campaigns:[], seq:1 };
  const su = { id:'u-roshan', org_id:null, role:'super_admin', full_name:'Roshan', email:'roshan@workwithroshan.com', phone:'', active:true, created_at:nowISO() };
  s.users.push(su);
  const mkOrg = (name, contact, email, max, execNames, plan) => {
    const o = { id:uid(), name, contact_name:contact, email, phone:'98'+Math.floor(10000000+Math.random()*89999999), plan, max_executives:max, auto_assign:true, rr_cursor:0, active:true, created_at:new Date(t0-86400e3*40).toISOString() };
    s.orgs.push(o);
    s.users.push({ id:uid(), org_id:o.id, role:'client_admin', full_name:contact, email, phone:o.phone, active:true, created_at:o.created_at });
    execNames.forEach((n,i) => s.users.push({ id:uid(), org_id:o.id, role:'executive', full_name:n, email:n.split(' ')[0].toLowerCase()+'@'+email.split('@')[1], phone:'9'+Math.floor(100000000+Math.random()*899999999), active:true, created_at:new Date(t0-86400e3*(30-i)).toISOString() }));
    return o;
  };
  const o1 = mkOrg('Urban Bites Café','Rakesh Malhotra','rakesh@urbanbites.in',10,['Priya Sharma','Arjun Mehta','Sneha Iyer','Karan Kapoor','Neha Joshi'],'growth');
  const o2 = mkOrg('GlowSkin Clinic','Dr. Meera Nair','meera@glowskin.in',5,['Ritu Bansal','Farhan Khan','Tanvi Rao'],'standard');
  [[o1,'Website form','website'],[o1,'Facebook — Brunch offer','facebook'],[o1,'Google Ads','google'],
   [o2,'Facebook — Free consult','facebook'],[o2,'IndiaMART','indiamart'],[o2,'Website form','website']]
   .forEach(([o,n,k]) => s.sources.push({ id:uid(), org_id:o.id, name:n, kind:k, api_key:Array.from({length:36},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join(''), active:true, created_at:o.created_at }));
  const statusW = ['new','new','new','contacted','contacted','interested','follow_up','follow_up','won','lost','not_interested'];
  [[o1,96],[o2,54]].forEach(([o,n]) => {
    const execs = s.users.filter(u => u.org_id===o.id && u.role==='executive');
    const srcs = s.sources.filter(x => x.org_id===o.id);
    for (let i=0;i<n;i++) {
      const created = new Date(t0 - Math.random()*86400e3*28 - (i<6 ? 0 : 3600e3)).toISOString();
      const st = i<6 ? 'new' : rnd(statusW);
      const ex = execs[i % execs.length];
      const fn = rnd(first), ln = rnd(last);
      let fu = null;
      if (st==='follow_up' || st==='interested') { const d = new Date(); d.setHours(10+Math.floor(Math.random()*8),0,0,0); d.setDate(d.getDate()+Math.floor(Math.random()*5)-2); fu = d.toISOString(); }
      const L = { id:uid(), org_id:o.id, name:fn+' '+ln, phone:'9'+Math.floor(100000000+Math.random()*899999999), email:(fn+'.'+ln).toLowerCase()+'@gmail.com', city:rnd(cities),
        source:rnd(srcs).name, status:st, assigned_to:ex.id, assigned_at:created, next_followup:fu, deal_value: st==='won' ? (o===o1?2500:8000)*(1+Math.floor(Math.random()*4)) : null,

      if (st!=='new') s.acts.push({ id:s.seq++, lead_id:L.id, org_id:o.id, user_id:ex.id, kind:'status', body:'Status: new → '+st, created_at:new Date(Date.parse(created)+3600e3*3).toISOString() });

    o.rr_cursor = n;

  return s;
}

class DemoAPI {
  constructor(){ this.mode='demo'; this.load(); }
  load(){ try { this.s = JSON.parse(localStorage.getItem(DEMO_KEY)); } catch(e){ this.s=null; } if(!this.s){ this.s = makeSeed(); this.save(); } }
  save(){ try { localStorage.setItem(DEMO_KEY, JSON.stringify(this.s)); } catch(e){} }
  reset(){ this.s = makeSeed(); this.save(); }
  get me(){ return this.s.users.find(u => u.id === this._me) || null; }
  async session(){ let id=null; try{ id = localStorage.getItem(DEMO_KEY+'_me'); }catch(e){} this._me=id; return this.me; }
  async demoLogin(userId){ this._me=userId; try{ localStorage.setItem(DEMO_KEY+'_me', userId);}catch(e){} return this.me; }
  async signIn(email){ const u = this.s.users.find(x => x.email.toLowerCase()===String(email).toLowerCase() && x.active); if(!u) throw new Error('No demo user with that email'); return this.demoLogin(u.id); }
  async signOut(){ this._me=null; try{ localStorage.removeItem(DEMO_KEY+'_me'); }catch(e){} }
  demoUsers(){ return this.s.users; }
  _orgScope(orgId){ const m=this.me; return m.role==='super_admin' ? orgId : m.org_id; }

  async listOrgs(){ const m=this.me; return m.role==='super_admin' ? [...this.s.orgs] : this.s.orgs.filter(o=>o.id===m.org_id); }
  async createClient(p){
    if (this.me.role!=='super_admin') throw new Error('Not allowed');
    if (!p.company || !p.email) throw new Error('Company and email are required');
    if (this.s.users.some(u=>u.email.toLowerCase()===p.email.toLowerCase())) throw new Error('A login with this email already exists');
    const o = { id:uid(), name:p.company, contact_name:p.contact_name, email:p.email, phone:p.phone, plan:p.plan||'standard', max_executives:+p.max_executives||10, auto_assign:true, rr_cursor:0, active:true, created_at:nowISO() };
    this.s.orgs.push(o);
    this.s.users.push({ id:uid(), org_id:o.id, role:'client_admin', full_name:p.contact_name||p.company, email:p.email, phone:p.phone, active:true, created_at:nowISO() });
    this.save(); return o;
  }
  async updateOrg(id, patch){ const o=this.s.orgs.find(x=>x.id===id); Object.assign(o, patch); this.save(); return o; }

  async listProfiles(orgId){ const m=this.me;
    if (m.role==='super_admin') return this.s.users.filter(u => orgId ? u.org_id===orgId : true);
    return this.s.users.filter(u => u.org_id===m.org_id); }
  async createExecutive(p){
    const org_id = this._orgScope(p.org_id); const o=this.s.orgs.find(x=>x.id===org_id);
    if (!['super_admin','client_admin'].includes(this.me.role)) throw new Error('Not allowed');
    if (!p.full_name || !p.email) throw new Error('Name and email are required');
    if (!p.password || p.password.length<8) throw new Error('Password must be 8+ characters');
    if (this.s.users.some(u=>u.email.toLowerCase()===p.email.toLowerCase())) throw new Error('A login with this email already exists');
    const n = this.s.users.filter(u=>u.org_id===org_id && u.role==='executive').length;
    if (n >= o.max_executives) throw new Error(`Executive limit reached (${o.max_executives}). Contact your CRM provider to upgrade.`);
    const u = { id:uid(), org_id, role:'executive', full_name:p.full_name, email:p.email, phone:p.phone, active:true, created_at:nowISO() };
    this.s.users.push(u); this.save(); return u;
  }
  async setActive(userId, active){ const u=this.s.users.find(x=>x.id===userId); u.active=active; this.save(); }
  async resetPassword(userId, pwd){ if(!pwd || pwd.length<8) throw new Error('Password must be 8+ characters'); }

  _visibleLeads(){ const m=this.me;
    if (m.role==='super_admin') return this.s.leads;
    if (m.role==='client_admin') return this.s.leads.filter(l=>l.org_id===m.org_id);
    return this.s.leads.filter(l=>l.assigned_to===m.id); }
  async listLeads(orgId){ let L=this._visibleLeads(); if (orgId) L=L.filter(l=>l.org_id===orgId); return L.map(l=>({...l})); }
  _pickNext(orgId){
    const o=this.s.orgs.find(x=>x.id===orgId); if(!o || !o.auto_assign || !o.active) return null;
    const ex=this.s.users.filter(u=>u.org_id===orgId && u.role==='executive' && u.active).sort((a,b)=>a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id));
    if(!ex.length) return null; const e=ex[o.rr_cursor % ex.length]; o.rr_cursor++; return e.id; }
  _act(lead, kind, body, userId){ this.s.acts.push({ id:this.s.seq++, lead_id:lead.id, org_id:lead.org_id, user_id: userId===undefined ? (this._me||null) : userId, kind, body, created_at:nowISO() }); }
  _name(id){ return (this.s.users.find(u=>u.id===id)||{}).full_name || 'nobody'; }
  async insertLeads(orgId, rows, mode='auto', asUser){
    const m=this.me; const out=[];
    for (const r of rows) {
      const L = { id:uid(), org_id: m && m.role!=='super_admin' ? m.org_id : orgId, name:r.name||'', phone:r.phone||null, email:r.email||null, city:r.city||null, source:r.source||'Manual',
        status:'new', assigned_to:null, assigned_at:null, next_followup:null, deal_value:null, notes:r.notes||'', extra:r.extra||{}, created_by: asUser===null?null:(this._me||null), created_at:nowISO(), updated_at:nowISO() };
      if (m && m.role==='executive') L.assigned_to = m.id;
      else if (mode && mode!=='auto' && mode!=='none') L.assigned_to = mode;
      else if (mode==='auto') L.assigned_to = this._pickNext(L.org_id);
      if (L.assigned_to) L.assigned_at = nowISO();
      this.s.leads.push(L); out.push(L);
      this._act(L,'created','Lead created from '+L.source, asUser===null?null:undefined);
      if (L.assigned_to) this._act(L,'assign','Assigned to '+this._name(L.assigned_to), asUser===null?null:undefined);
    }
    this.save(); return out.map(l=>({...l}));
  }
  async updateLead(id, patch){
    const L=this.s.leads.find(x=>x.id===id); const m=this.me;
    if (m.role==='executive'){ delete patch.assigned_to; delete patch.org_id; }
    if ('assigned_to' in patch && patch.assigned_to!==L.assigned_to){ L.assigned_at=nowISO(); this._act(L,'assign','Re-assigned to '+this._name(patch.assigned_to)); }
    if ('status' in patch && patch.status!==L.status) this._act(L,'status',`Status: ${L.status} → ${patch.status}`);
    if ('next_followup' in patch && patch.next_followup && patch.next_followup!==L.next_followup) this._act(L,'followup','Follow-up set for '+fmtDT(patch.next_followup));
    Object.assign(L, patch, { updated_at:nowISO() }); this.save(); return {...L};
  }
  async deleteLeads(ids){ const set=new Set(ids); this.s.leads=this.s.leads.filter(l=>!set.has(l.id)); this.s.acts=this.s.acts.filter(a=>!set.has(a.lead_id)); this.save(); }
  async listActivities(leadId){ return this.s.acts.filter(a=>a.lead_id===leadId).sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(a=>({...a, user_name: a.user_id ? this._name(a.user_id) : 'System'})); }
  async addActivity(leadId, kind, body){ const L=this.s.leads.find(x=>x.id===leadId); this._act(L,kind,body); L.updated_at=nowISO(); this.save(); }
  async distributeUnassigned(orgId){ let n=0; for (const L of this.s.leads.filter(l=>l.org_id===orgId && !l.assigned_to)) { const e=this._pickNext(orgId); if(!e) break; L.assigned_to=e; L.assigned_at=nowISO(); this._act(L,'assign','Assigned to '+this._name(e)); n++; } this.save(); return n; }

  async listSources(orgId){ return this.s.sources.filter(x=>x.org_id===this._orgScope(orgId)); }
  async createSource(orgId, name, kind){ const x={ id:uid(), org_id:this._orgScope(orgId), name, kind, api_key:Array.from({length:36},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join(''), active:true, created_at:nowISO() }; this.s.sources.push(x); this.save(); return x; }
  async updateSource(id, patch){ Object.assign(this.s.sources.find(x=>x.id===id), patch); this.save(); }
  async deleteSource(id){ this.s.sources=this.s.sources.filter(x=>x.id!==id); this.save(); }
  async simulateWebhook(src, body){ return (await this.insertLeads(src.org_id, [{ ...body, source:src.name, extra:body }], 'auto', null))[0]; }

  async listCampaigns(orgId){ return this.s.campaigns.filter(c=> orgId ? c.org_id===orgId : (this.me.role==='super_admin' || c.org_id===this.me.org_id)); }
  async createCampaign(c){ const x={ id:uid(), sent:0, status:'draft', created_by:this._me, created_at:nowISO(), ...c, org_id:this._orgScope(c.org_id) }; this.s.campaigns.push(x); this.save(); return x; }
  async updateCampaign(id, patch){ Object.assign(this.s.campaigns.find(x=>x.id===id), patch); this.save(); }
  async deleteCampaign(id){ this.s.campaigns=this.s.campaigns.filter(x=>x.id!==id); this.save(); }
}

/* ------------------------------------------------------------ SUPABASE */
class SupaAPI {
  constructor(cfg){ this.mode='live'; this.cfg=cfg; this.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); this.profile=null; }
  get me(){ return this.profile; }
  async _loadProfile(){ const { data:{ user } } = await this.sb.auth.getUser(); if(!user){ this.profile=null; return null; }
    const { data, error } = await this.sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (error) throw error; if (!data || !data.active) { await this.sb.auth.signOut(); throw new Error('Your account is not active. Contact your administrator.'); }
    this.profile=data; return data; }
  async session(){ const { data } = await this.sb.auth.getSession(); if(!data.session) return null; try { return await this._loadProfile(); } catch(e){ return null; } }
  async signIn(email, password){ const { error } = await this.sb.auth.signInWithPassword({ email, password }); if (error) throw new Error(error.message==='Invalid login credentials'?'Wrong email or password':error.message); return this._loadProfile(); }
  async signOut(){ await this.sb.auth.signOut(); this.profile=null; }
  async _fn(body){ const { data, error } = await this.sb.functions.invoke('admin-users', { body });
    if (error) { let msg=error.message; try { const j = await error.context.json(); msg=j.error||msg; } catch(e){} throw new Error(msg); }
    if (data && data.error) throw new Error(data.error); return data; }
  _chk({ data, error }){ if (error) throw new Error(error.message); return data; }

  async listOrgs(){ return this._chk(await this.sb.from('organizations').select('*').order('created_at')); }
  async createClient(p){ return (await this._fn({ action:'create_client', ...p })).org; }
  async updateOrg(id, patch){ return this._chk(await this.sb.from('organizations').update(patch).eq('id',id).select().single()); }
  async listProfiles(orgId){ let q=this.sb.from('profiles').select('*').order('created_at'); if(orgId) q=q.eq('org_id',orgId); return this._chk(await q); }
  async createExecutive(p){ return this._fn({ action:'create_executive', ...p }); }
  async setActive(userId, active){ return this._fn({ action:'set_active', user_id:userId, active }); }
  async resetPassword(userId, password){ return this._fn({ action:'reset_password', user_id:userId, password }); }

  async listLeads(orgId){ const all=[]; const size=1000;
    for (let from=0; from<50000; from+=size){ let q=this.sb.from('leads').select('*').order('created_at',{ascending:false}).range(from, from+size-1); if(orgId) q=q.eq('org_id',orgId);
      const rows=this._chk(await q); all.push(...rows); if(rows.length<size) break; }
    return all; }
  async insertLeads(orgId, rows, mode='auto'){
    const out=[]; const payload = rows.map(r => { const x = { org_id:orgId, name:r.name||'', phone:r.phone||null, email:r.email||null, city:r.city||null, source:r.source||'Manual', notes:r.notes||null, extra:{ ...(r.extra||{}) } };
      if (mode==='none') x.extra._no_auto = true; else if (mode && mode!=='auto') x.assigned_to = mode; return x; });
    for (let i=0;i<payload.length;i+=500){ out.push(...this._chk(await this.sb.from('leads').insert(payload.slice(i,i+500)).select())); }
    return out; }
  async updateLead(id, patch){ return this._chk(await this.sb.from('leads').update(patch).eq('id',id).select().single()); }
  async deleteLeads(ids){ for (let i=0;i<ids.length;i+=200) this._chk(await this.sb.from('leads').delete().in('id', ids.slice(i,i+200))); }
  async listActivities(leadId){ const rows=this._chk(await this.sb.from('lead_activities').select('*, profiles(full_name)').eq('lead_id',leadId).order('created_at',{ascending:false}));
    return rows.map(a=>({ ...a, user_name: a.profiles ? a.profiles.full_name : 'System' })); }
  async addActivity(leadId, kind, body){ const L=this._chk(await this.sb.from('leads').select('org_id').eq('id',leadId).single());
    this._chk(await this.sb.from('lead_activities').insert({ lead_id:leadId, org_id:L.org_id, user_id:this.profile.id, kind, body })); }
  async distributeUnassigned(orgId){ return this._chk(await this.sb.rpc('distribute_unassigned', { p_org: orgId })); }
  async listSources(orgId){ let q=this.sb.from('lead_sources').select('*').order('created_at'); if(orgId) q=q.eq('org_id',orgId); return this._chk(await q); }
  async createSource(orgId, name, kind){ return this._chk(await this.sb.from('lead_sources').insert({ org_id:orgId||this.profile.org_id, name, kind }).select().single()); }
  async updateSource(id, patch){ this._chk(await this.sb.from('lead_sources').update(patch).eq('id',id)); }
  async deleteSource(id){ this._chk(await this.sb.from('lead_sources').delete().eq('id',id)); }
  async simulateWebhook(src, body){ const r = await fetch(`${this.cfg.SUPABASE_URL}/functions/v1/capture-lead?key=${src.api_key}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error||'Failed'); return j; }
  async listCampaigns(orgId){ let q=this.sb.from('campaigns').select('*').order('created_at',{ascending:false}); if(orgId) q=q.eq('org_id',orgId); return this._chk(await q); }
  async createCampaign(c){ return this._chk(await this.sb.from('campaigns').insert({ ...c, org_id:c.org_id||this.profile.org_id, created_by:this.profile.id }).select().single()); }
  async updateCampaign(id, patch){ this._chk(await this.sb.from('campaigns').update(patch).eq('id',id)); }
  async deleteCampaign(id){ this._chk(await this.sb.from('campaigns').delete().eq('id',id)); }
}

<script>/* =====================================================================
   Roshan CRM — application
   ===================================================================== */
const CFG = window.CRM_CONFIG || {};
const api = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase) ? new SupaAPI(CFG) : new DemoAPI();
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const h = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase() || '?';
const pct = (a,b) => b ? Math.round(a*1000/b)/10 : 0;
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(d){ if(!d) return '—'; return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true}); }
function fmtTime(d){ return new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function rel(d){ const s=(Date.now()-Date.parse(d))/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<86400*7) return Math.floor(s/86400)+'d ago'; return fmtDate(d); }
const sod = (d=new Date()) => { const x=new Date(d); x.setHours(0,0,0,0); return x; };
const isToday = d => d && sod(d).getTime()===sod().getTime();
const isOverdue = d => d && Date.parse(d) < Date.now() && !isToday(d);
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN');
const waNum = p => { let d=String(p||'').replace(/\D/g,''); if(d.length===10) d='91'+d; return d; };
const CLOSED = ['won','lost','not_interested'];

function rangeOf(key){
  const t=sod(), D=86400e3;
  switch(key){
    case 'today': return [t, null];
    case 'yesterday': return [new Date(t-D), t];
    case '7d': return [new Date(t-6*D), null];
    case '30d': return [new Date(t-29*D), null];
    case 'month': return [new Date(t.getFullYear(), t.getMonth(), 1), null];
    case 'lastmonth': return [new Date(t.getFullYear(), t.getMonth()-1, 1), new Date(t.getFullYear(), t.getMonth(), 1)];
    case '90d': return [new Date(t-89*D), null];
    default: return [null,null];
  }
}
const RANGES = [['all','All time'],['today','Today'],['yesterday','Yesterday'],['7d','Last 7 days'],['30d','Last 30 days'],['month','This month'],['lastmonth','Last month'],['90d','Last 90 days']];
const inRange = (d, key) => { const [a,b]=rangeOf(key); const t=Date.parse(d); return (!a || t>=a.getTime()) && (!b || t<b.getTime()); };

const ACT_ICON = { created:'plus', assign:'shuffle', status:'flag', note:'note', call:'phone', whatsapp:'wa', email:'mail', followup:'clock' };

/* ------------------------------------------------------------- state */
const S = {
  me:null, orgs:[], org:'', page:'dashboard', leads:[], profiles:[], sources:[], campaigns:[],
  f:{ q:'', status:'', source:'', owner:'', range:'all', page:1, size:50 }, sel:new Set(),
  fu:'overdue', rep:'30d', up:{ step:1 }, loading:false,
};
const isSuper = () => S.me?.role==='super_admin';
const isAdmin = () => S.me?.role==='client_admin';
const isExec  = () => S.me?.role==='executive';
const canManage = () => isSuper() || isAdmin();
const curOrgId = () => isSuper() ? S.org : S.me?.org_id;
const curOrg = () => S.orgs.find(o => o.id===curOrgId());
const orgName = id => (S.orgs.find(o=>o.id===id)||{}).name || '—';
const person = id => S.profiles.find(p=>p.id===id);
const pname = id => id ? (person(id)?.full_name || 'Unknown') : 'Unassigned';
const execs = (orgId=curOrgId(), activeOnly=false) => S.profiles.filter(p=>p.role==='executive' && (!orgId || p.org_id===orgId) && (!activeOnly || p.active));
const scopedLeads = () => { const o=curOrgId(); return o ? S.leads.filter(l=>l.org_id===o) : S.leads; };

/* ----------------------------------------------------------- toasts etc */
function toast(msg, err=false){ let w=$('.toast-wrap'); if(!w){ w=document.createElement('div'); w.className='toast-wrap'; document.body.appendChild(w); }
  const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; w.appendChild(t); setTimeout(()=>t.remove(), 3200); }
function closeLayer(){ const m=$('.modal'); if(m && m._res){ const r=m._res; m._res=null; r(false); } $$('.overlay,.drawer,.modal').forEach(e=>e.remove()); S.openLead=null; }
function openModal(html, wide=false){ closeLayer(); document.body.insertAdjacentHTML('beforeend', `<div class="overlay" data-act="close"></div><div class="modal ${wide?'wide':''}" role="dialog">${html}</div>`); const f=$('.modal input,.modal select,.modal textarea'); if(f) f.focus(); }
function ask({ title, body='', confirm='Confirm', danger=false, input=null }){ return new Promise(res => {
  openModal(`<h3>${h(title)}</h3>${body?`<p class="muted">${body}</p>`:''}<form data-form="ask">${input!==null?`<div class="field" style="margin-top:12px"><input class="input" id="ask-in" value="${h(input)}"></div>`:''}<div class="modal-f"><button type="button" class="btn btn-ghost" data-act="close">Cancel</button><button class="btn ${danger?'btn-danger':'btn-primary'}" type="submit">${h(confirm)}</button></div></form>`);
  const m=$('.modal'); m._res=res; if(input!==null) $('#ask-in').select(); }); }
async function busy(btn, fn){ const t=btn?.innerHTML; if(btn){ btn.disabled=true; btn.innerHTML='Please wait…'; } try { return await fn(); } catch(e){ toast(e.message||String(e), true); } finally { if(btn && document.body.contains(btn)){ btn.disabled=false; btn.innerHTML=t; } } }
function download(name, text, type='text/csv'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); }
const csvCell = v => { const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const toCSV = rows => rows.map(r=>r.map(csvCell).join(',')).join('\n');
const statusPill = s => `<span class="pill s-${h(s)}">${h(STATUS_LABEL[s]||s)}</span>`;
function fuTag(l){ if(!l.next_followup || CLOSED.includes(l.status)) return '<span class="muted">—</span>';
  if(isOverdue(l.next_followup)) return `<span class="tag overdue">Overdue · ${fmtDate(l.next_followup)}</span>`;
  if(isToday(l.next_followup)) return `<span class="tag today">Today ${fmtTime(l.next_followup)}</span>`;
  return `<span class="tag">${fmtDT(l.next_followup)}</span>`; }

/* ----------------------------------------------------------- data load */
async function loadAll(){
  S.loading=true; render();
  try {
    S.orgs = await api.listOrgs();
    if (isSuper() && S.org && !S.orgs.find(o=>o.id===S.org)) S.org='';
    const o = curOrgId();
    const [profiles, leads] = await Promise.all([api.listProfiles(isSuper()? '' : o), api.listLeads(isSuper()? (o||'') : '')]);
    S.profiles=profiles; S.leads=leads;
    if (canManage()) { [S.sources, S.campaigns] = await Promise.all([ o ? api.listSources(o) : Promise.resolve([]), api.listCampaigns(isSuper()? o : '') ]); }
  } catch(e){ toast(e.message, true); }
  S.loading=false; render();
}
async function refreshLeads(){ const o=curOrgId(); S.leads = await api.listLeads(isSuper()? (o||'') : ''); }

/* ================================================================ SHELL */
function navItems(){
  if (isExec()) return [['dashboard','home','Dashboard'],['leads','leads','My Leads'],['followups','clock','Follow-ups']];
  const items = [['dashboard','home','Dashboard'],['leads','leads','Leads'],['followups','clock','Follow-ups'],['upload','upload','Upload Leads'],['team','team','Team'],['sources','plug','Lead Sources'],['campaigns','send','Campaigns'],['reports','chart','Reports']];
  return isSuper() ? [['clients','building','Clients'], ...items] : items;
}
const TITLES = { dashboard:['Your','dashboard'], leads:['All','leads'], followups:['Follow-','ups'], upload:['Upload','leads'], team:['Sales','team'], sources:['Lead','sources'], campaigns:['Campaigns',''], reports:['Reports',''], clients:['Your','clients'] };
function renderShell(){
  const due = (isExec()? S.leads : scopedLeads()).filter(l=>l.next_followup && !CLOSED.includes(l.status) && (isToday(l.next_followup)||isOverdue(l.next_followup))).length;
  const nav = navItems().map(([k,i,l]) => `<a class="${S.page===k?'active':''}" data-act="nav" data-page="${k}">${ic(i)}<span>${l}</span>${k==='followups'&&due?`<span class="count">${due}</span>`:''}</a>`).join('');
  const ws = isSuper()
    ? `<div class="ws"><label>Workspace</label><select data-act="ws">${`<option value="">All clients</option>`+S.orgs.map(o=>`<option value="${o.id}" ${o.id===S.org?'selected':''}>${h(o.name)}</option>`).join('')}</select></div>`
    : `<div class="ws"><label>Company</label><div class="ws-name">${h(curOrg()?.name||'')}</div></div>`;
  const roleLabel = {super_admin:'Super Admin',client_admin:'Admin',executive:'Sales Executive'}[S.me.role];
  const [t1,t2] = (isExec() && S.page==='leads') ? ['My','leads'] : (TITLES[S.page]||['','']);
  return `<div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><span>Roshan<span class="dot">.</span></span><small>CRM</small></div>
      ${ws}
      <div class="nav-label">Menu</div>
      <nav class="nav">${nav}</nav>
      <div class="side-foot"><span class="avatar">${initials(S.me.full_name)}</span><div class="who"><b>${h(S.me.full_name)}</b><span>${roleLabel}</span></div><button class="icon-btn" title="Sign out" data-act="logout">${ic('logout','width="16"')}</button></div>

    <main class="main">
      <div class="topbar">
        <button class="icon-btn menu-btn" data-act="menu">${ic('menu','width="18"')}</button>
        <h2>${h(t1)} ${t2?`<span class="script" style="text-decoration:none">${h(t2)}</span>`:''}</h2>
        <span class="spacer"></span>
        ${api.mode==='demo'?'<span class="demo-pill">Demo mode</span>':''}
        ${S.page!=='leads' ? `<button class="btn btn-primary btn-sm" data-act="add-lead">${ic('plus','width="16"')} Add lead</button>`:''}
      </div>
      <div class="content">${S.loading ? '<div class="spinner"></div>' : (PAGES[S.page]||PAGES.dashboard)()}</div>
    </main>

}
function render(){
  const root=$('#app');
  if (!S.me) { root.innerHTML = renderLogin(); return; }
  if (!navItems().some(n=>n[0]===S.page)) S.page='dashboard';
  root.innerHTML = renderShell();
  if (S.openLead) {} // drawer handled separately
}
function go(page){ S.page=page; S.sel.clear(); location.hash='#'+page; render(); window.scrollTo(0,0); }
function needOrg(what){ return `<div class="panel empty"><h4>Pick a client first</h4><p>Choose a client in the <b>Workspace</b> switcher on the left to ${what}.</p><div class="row" style="justify-content:center;margin-top:10px">${S.orgs.map(o=>`<button class="btn btn-ghost btn-sm" data-act="pick-org" data-id="${o.id}">${h(o.name)}</button>`).join('')}</div></div>`; }

/* ============================================================= PAGES */
const PAGES = {};

/* ---------- Dashboard */
PAGES.dashboard = () => {
  const L = isExec() ? S.leads : scopedLeads();
  const today = L.filter(l=>isToday(l.created_at)).length;
  const open = L.filter(l=>!CLOSED.includes(l.status));
  const dueToday = open.filter(l=>l.next_followup && isToday(l.next_followup));
  const overdue = open.filter(l=>l.next_followup && isOverdue(l.next_followup));
  const won = L.filter(l=>l.status==='won');
  const wonMonth = won.filter(l=>inRange(l.updated_at,'month'));
  const fresh = L.filter(l=>l.status==='new');
  const kpis = `<div class="kpis">
    <div class="kpi dark"><div class="k-label">${isExec()?'My leads':'Total leads'}</div><div class="k-val">${L.length}</div><div class="k-sub">${today} new today</div></div>
    <div class="kpi"><div class="k-label">Untouched (Open)</div><div class="k-val">${fresh.length}</div><div class="k-sub">waiting for first call</div></div>
    <div class="kpi"><div class="k-label">Follow-ups today</div><div class="k-val">${dueToday.length}</div><div class="k-sub">${overdue.length} overdue</div></div>
    <div class="kpi"><div class="k-label">Won this month</div><div class="k-val">${wonMonth.length}</div><div class="k-sub">${inr(wonMonth.reduce((a,l)=>a+(+l.deal_value||0),0))} value</div></div>
    <div class="kpi"><div class="k-label">Conversion</div><div class="k-val">${pct(won.length, L.length)}%</div><div class="k-sub">won ÷ all leads</div></div>
  </div>`;
  // last 14 days chart
  const days=[...Array(14)].map((_,i)=>{ const d=sod(); d.setDate(d.getDate()-13+i); return d; });
  const counts=days.map(d=>L.filter(l=>sod(l.created_at).getTime()===d.getTime()).length); const mx=Math.max(1,...counts);
  const chart = `<div class="vchart">${days.map((d,i)=>`<div class="vb" title="${counts[i]} leads"><small>${counts[i]||''}</small><span style="height:${counts[i]/mx*100}%"></span><small>${d.getDate()}</small></div>`).join('')}</div>`;
  const sb = STATUSES.map(([k,lbl])=>{ const n=L.filter(l=>l.status===k).length; return `<div class="bar-row"><span>${lbl}</span><div class="bar-track"><div class="bar-fill ${k==='won'?'g':''}" style="width:${pct(n,L.length)}%"></div></div><b class="small">${n}</b></div>`; }).join('');
  const fuList = [...overdue, ...dueToday].slice(0,8).map(l=>`<div class="li" data-act="open-lead" data-id="${l.id}"><span class="avatar sm">${initials(l.name)}</span><div class="grow"><b>${h(l.name||l.phone)}</b><span class="small muted">${h(l.phone||'')} · ${h(pname(l.assigned_to))}</span></div>${fuTag(l)}</div>`).join('') || '<p class="muted small">Nothing due. Nice work.</p>';
  if (isExec()) {
    const newList = fresh.slice(0,8).map(l=>`<div class="li" data-act="open-lead" data-id="${l.id}"><span class="avatar sm">${initials(l.name)}</span><div class="grow"><b>${h(l.name||l.phone)}</b><span class="small muted">${h(l.source||'')} · ${rel(l.created_at)}</span></div><a class="btn btn-ghost btn-xs" href="tel:${h(l.phone)}" data-act="log-call" data-id="${l.id}">${ic('phone','width="13"')} Call</a></div>`).join('') || '<p class="muted small">No new leads right now.</p>';
    return kpis + `<div class="cols-eq"><div class="panel"><div class="panel-h"><h3>Follow-ups due</h3><span class="spacer"></span><a class="small" data-act="nav" data-page="followups" href="#">View all →</a></div><div class="list">${fuList}</div></div>
      <div class="panel"><div class="panel-h"><h3>New leads to call</h3></div><div class="list">${newList}</div></div></div>
      <div class="panel" style="margin-top:18px"><div class="panel-h"><h3>My pipeline</h3></div><div class="bars">${sb}</div></div>`;
  }
  let clientsTbl='';
  if (isSuper() && !S.org) {
    clientsTbl = `<div class="panel" style="margin-bottom:18px"><div class="panel-h"><h3>Clients overview</h3><span class="spacer"></span><a class="small" href="#" data-act="nav" data-page="clients">Manage clients →</a></div>
    <div class="table-wrap" style="box-shadow:none"><table class="t cards"><thead><tr><th>Client</th><th>Executives</th><th>Leads</th><th>New today</th><th>Won</th><th>Conversion</th><th></th></tr></thead><tbody>
    ${S.orgs.map(o=>{ const ol=S.leads.filter(l=>l.org_id===o.id); const w=ol.filter(l=>l.status==='won').length; return `<tr><td class="name">${h(o.name)}</td><td data-l="Executives">${execs(o.id).length} / ${o.max_executives}</td><td data-l="Leads">${ol.length}</td><td data-l="Today">${ol.filter(l=>isToday(l.created_at)).length}</td><td data-l="Won">${w}</td><td data-l="Conv">${pct(w,ol.length)}%</td><td><button class="btn btn-ghost btn-xs" data-act="pick-org" data-id="${o.id}">Open</button></td></tr>`; }).join('')}
    </tbody></table></div></div>`;

  const board = execs().map(e=>{ const el=L.filter(l=>l.assigned_to===e.id); return { e, n:el.length, w:el.filter(l=>l.status==='won').length, t:el.filter(l=>l.status!=='new').length }; }).sort((a,b)=>b.w-a.w||b.t-a.t).slice(0,6)
    .map((r,i)=>`<div class="li" style="cursor:default"><span class="avatar sm">${i===0&&r.w?ic('star','width="14"'):initials(r.e.full_name)}</span><div class="grow"><b>${h(r.e.full_name)}${isSuper()&&!S.org?` <span class="small muted">· ${h(orgName(r.e.org_id))}</span>`:''}</b><span class="small muted">${r.n} leads · ${r.t} worked</span></div><span class="pill s-won">${r.w} won</span></div>`).join('') || '<p class="muted small">No executives yet.</p>';

    <div class="stack"><div class="panel"><div class="panel-h"><h3>Team leaderboard</h3></div><div class="list">${board}</div></div>

};

/* ---------- Leads */
function filteredLeads(){
  const f=S.f; const q=f.q.trim().toLowerCase();
  return (isExec()? S.leads : scopedLeads()).filter(l =>
    (!f.status || l.status===f.status) && (!f.source || l.source===f.source) &&
    (!f.owner || (f.owner==='__none' ? !l.assigned_to : l.assigned_to===f.owner)) &&
    (f.range==='all' || inRange(l.created_at, f.range)) &&
    (!q || [l.name,l.phone,l.email,l.city].some(v=>String(v||'').toLowerCase().includes(q))))
    .sort((a,b)=>b.created_at.localeCompare(a.created_at));
}
PAGES.leads = () => {
  const base = isExec()? S.leads : scopedLeads(); const f=S.f;
  const all = filteredLeads(); const pages=Math.max(1,Math.ceil(all.length/f.size)); if(f.page>pages) f.page=pages;
  const rows = all.slice((f.page-1)*f.size, f.page*f.size);
  const sources=[...new Set(base.map(l=>l.source).filter(Boolean))].sort();

const FIELD_GUESS = { name:['name','fullname','customername','leadname','firstname','contactname'], phone:['phone','mobile','mobileno','phonenumber','contact','contactno','whatsapp','number','mobilenumber'], email:['email','emailid','emailaddress','mail'], city:['city','location','town','district','state'], source:['source','leadsource','campaign'] };
function guessMap(headers){ const m={}; for (const [f,keys] of Object.entries(FIELD_GUESS)) { const i=headers.findIndex(x=>keys.includes(String(x).toLowerCase().replace(/[^a-z]/g,''))); m[f]= i>=0 ? i : ''; } return m; }
function parseCSV(text){
  const delim = (text.split('\n')[0].match(/\t/g)||[]).length > (text.split('\n')[0].match(/,/g)||[]).length ? '\t' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for (let i=0;i<text.length;i++){ const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if (c==='"') q=true; else if (c===delim){ row.push(cur); cur=''; }
    else if (c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c; }
  if (cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function previewDistribution(n){
  const o=curOrg(); const ex=execs(o?.id,true).sort((a,b)=>a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id));

  for(let i=0;i<n;i++){ res[ex[c%ex.length].id]++; c++; } return res;
}

/* ---------- Reports */
PAGES.reports = () => {
  const L = scopedLeads().filter(l=>S.rep==='all'||inRange(l.created_at,S.rep));
  const ex = execs(); const showOrg = isSuper() && !S.org;
  const rows = ex.map(e=>{ const el=L.filter(l=>l.assigned_to===e.id); const c=k=>el.filter(l=>l.status===k).length;
    return { e, n:el.length, open:c('new'), worked:el.filter(l=>l.status!=='new').length, int:c('interested'), fu:c('follow_up'), won:c('won'), lost:c('lost')+c('not_interested'), od:el.filter(l=>l.next_followup&&!CLOSED.includes(l.status)&&isOverdue(l.next_followup)).length, val:el.filter(l=>l.status==='won').reduce((a,l)=>a+(+l.deal_value||0),0) }; })
    .sort((a,b)=>b.won-a.won||b.n-a.n);
  S._repRows = rows;
  const srcs=[...new Set(L.map(l=>l.source||'—'))].map(s=>{ const sl=L.filter(l=>(l.source||'—')===s); const w=sl.filter(l=>l.status==='won').length; return {s,n:sl.length,w}; }).sort((a,b)=>b.n-a.n);
  const mx=Math.max(1,...srcs.map(x=>x.n)); const won=L.filter(l=>l.status==='won');
  return `<div class="toolbar"><select class="input" data-act="rep-range">${RANGES.map(([k,l])=>`<option value="${k}" ${S.rep===k?'selected':''}>${l}</option>`).join('')}</select><span class="spacer"></span><button class="btn btn-ghost btn-sm" data-act="export-rep">${ic('dl','width="15"')} Export CSV</button></div>
  <div class="kpis"><div class="kpi dark"><div class="k-label">Leads</div><div class="k-val">${L.length}</div></div><div class="kpi"><div class="k-label">Worked</div><div class="k-val">${pct(L.filter(l=>l.status!=='new').length,L.length)}%</div><div class="k-sub">contacted at least once</div></div>
  <div class="kpi"><div class="k-label">Won</div><div class="k-val">${won.length}</div><div class="k-sub">${inr(won.reduce((a,l)=>a+(+l.deal_value||0),0))}</div></div><div class="kpi"><div class="k-label">Conversion</div><div class="k-val">${pct(won.length,L.length)}%</div></div></div>
  <div class="panel" style="margin-bottom:18px"><div class="panel-h"><h3>Executive performance</h3></div><div class="table-wrap" style="box-shadow:none"><table class="t cards"><thead><tr><th>Executive</th>${showOrg?'<th>Client</th>':''}<th>Leads</th><th>Open</th><th>Worked</th><th>Interested</th><th>Follow-up</th><th>Won</th><th>Lost</th><th>Conv.</th><th>Overdue</th><th>Value</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="name">${h(r.e.full_name)}${r.e.active?'':' <span class="tag">off</span>'}</td>${showOrg?`<td data-l="Client">${h(orgName(r.e.org_id))}</td>`:''}<td data-l="Leads"><b>${r.n}</b></td><td data-l="Open">${r.open}</td><td data-l="Worked">${r.worked}</td><td data-l="Interested">${r.int}</td><td data-l="Follow-up">${r.fu}</td><td data-l="Won"><span class="pill s-won">${r.won}</span></td><td data-l="Lost">${r.lost}</td><td data-l="Conv"><b>${pct(r.won,r.n)}%</b></td><td data-l="Overdue">${r.od?`<span class="tag overdue">${r.od}</span>`:'0'}</td><td data-l="Value">${inr(r.val)}</td></tr>`).join('') || '<tr><td colspan="12" class="muted">No executives</td></tr>'}
  </tbody></table></div></div>
  <div class="cols-eq"><div class="panel"><div class="panel-h"><h3>Leads by source</h3></div><div class="bars">${srcs.map(x=>`<div class="bar-row" style="grid-template-columns:150px 1fr 90px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(x.s)}</span><div class="bar-track"><div class="bar-fill" style="width:${x.n/mx*100}%"></div></div><span class="small"><b>${x.n}</b> · ${pct(x.w,x.n)}% won</span></div>`).join('')||'<p class="muted">No data</p>'}</div></div>
  <div class="panel"><div class="panel-h"><h3>Status funnel</h3></div><div class="bars">${STATUSES.map(([k,lbl])=>{ const n=L.filter(l=>l.status===k).length; return `<div class="bar-row"><span>${lbl}</span><div class="bar-track"><div class="bar-fill ${k==='won'?'g':''}" style="width:${pct(n,L.length)}%"></div></div><b class="small">${n}</b></div>`; }).join('')}</div></div></div>`;

        <a class="act" href="mailto:${h(l.email)}" data-act="log-mail" data-id="${l.id}">${ic('mail')}Email</a></div>
      <div class="section-t">Lead status</div>
      <div class="status-grid">${STATUSES.map(([k,lbl])=>`<span class="pill s-${k} ${l.status===k?'sel':''}" data-act="set-status" data-v="${k}">${lbl}</span>`).join('')}</div>

      <div class="section-t">Add a note</div>
      <textarea class="input" id="note" rows="3" placeholder="What happened on the call? Next step?"></textarea>
      <div class="row" style="margin-top:8px"><span class="spacer"></span><button class="btn btn-primary btn-sm" data-act="add-note">Save note</button></div>
      <div class="section-t">Details</div>
      <form data-form="lead-details">${ownerSel}
        <div class="grid2"><div class="field"><label>Name</label><input class="input" name="name" value="${h(l.name)}"></div><div class="field"><label>Mobile</label><input class="input" name="phone" value="${h(l.phone)}"></div>
        <div class="field"><label>Email</label><input class="input" name="email" value="${h(l.email)}"></div><div class="field"><label>City</label><input class="input" name="city" value="${h(l.city)}"></div>

async function patchLead(patch, msg){ const id=S.openLead; const upd = await api.updateLead(id, patch); const i=S.leads.findIndex(x=>x.id===id); if(i>=0) S.leads[i]={...S.leads[i], ...upd}; if(msg) toast(msg); render(); await openLead(id); }
async function logAct(id, kind, body){ try { await api.addActivity(id, kind, body); const l=S.leads.find(x=>x.id===id); if(l && l.status==='new' && kind!=='note'){ const u=await api.updateLead(id,{status:'contacted'}); Object.assign(l,u); } l && (l.updated_at=new Date().toISOString()); if(S.openLead===id) openLead(id); else render(); } catch(e){ toast(e.message,true); } }

  <form data-form="add-camp"><div class="grid2"><div class="field"><label>Campaign name <span class="req">*</span></label><input class="input" name="name" required placeholder="Diwali offer follow-up"></div>
  <div class="field"><label>Channel</label><select class="input" name="channel" data-act="camp-aud"><option value="whatsapp">WhatsApp</option><option value="sms">SMS</option><option value="email">Email</option></select></div>
  <div class="field"><label>Lead status</label><select class="input" name="status" data-act="camp-aud"><option value="">Any status</option>${STATUSES.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
  <div class="field"><label>Source</label><select class="input" name="source" data-act="camp-aud"><option value="">Any source</option>${srcs.map(s=>`<option>${h(s)}</option>`).join('')}</select></div>
  <div class="field"><label>Owner</label><select class="input" name="owner" data-act="camp-aud"><option value="">Anyone</option>${execs().map(e=>`<option value="${e.id}">${h(e.full_name)}</option>`).join('')}</select></div>
  <div class="field"><label>Email subject</label><input class="input" name="subject" placeholder="(email only)"></div></div>
  <div class="field"><label>Message <span class="req">*</span></label><textarea class="input" name="message" rows="4" required>Hi {name}, thanks for your interest! We have a special offer this week. Reply YES and {owner} will call you with details.</textarea></div>
  <div class="note" id="aud-count">Calculating audience…</div>
  <div class="modal-f"><button type="button" class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" type="submit">Create campaign</button></div></form>`);
  updAud();
}
function updAud(){ const f=$('form[data-form="add-camp"]'); if(!f) return; const a=Object.fromEntries(new FormData(f)); const n=audienceOf(a).length; $('#aud-count').innerHTML=`<b>${n}</b> lead${n===1?'':'s'} will receive this${a.channel==='email'?' (only leads with an email)':''}.`; }
function campView(c){
  const sent=new Set(c.audience.sent_ids||[]); const ids=c.audience.ids||[]; const L=ids.map(id=>S.leads.find(l=>l.id===id)).filter(Boolean);
  const link = l => { const m=fillMsg(c.message,l); return c.channel==='whatsapp' ? `https://wa.me/${waNum(l.phone)}?text=${encodeURIComponent(m)}` : c.channel==='sms' ? `sms:${l.phone}?body=${encodeURIComponent(m)}` : `mailto:${l.email}?subject=${encodeURIComponent(c.subject||c.name)}&body=${encodeURIComponent(m)}`; };
  openModal(`<div class="row"><h3>${h(c.name)}</h3><span class="spacer"></span><button class="icon-btn" data-act="close">${ic('x','width="16"')}</button></div>
  <p class="muted small">${h({whatsapp:'WhatsApp',sms:'SMS',email:'Email'}[c.channel])} · ${sent.size} of ${ids.length} sent</p><div class="progress"><span style="width:${pct(sent.size,ids.length)}%"></span></div>
  <div class="code" style="white-space:pre-wrap;margin-bottom:14px">${h(c.message)}</div>
  <div class="row" style="margin-bottom:10px"><button class="btn btn-ghost btn-sm" data-act="camp-export" data-id="${c.id}">${ic('dl','width="15"')} Export list (CSV)</button>${L.find(l=>!sent.has(l.id))?`<a class="btn btn-green btn-sm" target="_blank" rel="noopener" href="${h(link(L.find(l=>!sent.has(l.id))))}" data-act="camp-send" data-c="${c.id}" data-id="${L.find(l=>!sent.has(l.id)).id}">Send next →</a>`:'<span class="pill s-won">All sent</span>'}<span class="spacer"></span><button class="btn btn-danger btn-xs" data-act="camp-del" data-id="${c.id}">Delete campaign</button></div>
  <div class="table-wrap" style="max-height:340px;overflow-y:auto"><table class="t"><tbody>${L.map(l=>`<tr><td><div class="name">${h(l.name)}</div><div class="sub">${h(c.channel==='email'?l.email:l.phone)}</div></td><td>${statusPill(l.status)}</td><td style="text-align:right">${sent.has(l.id)?'<span class="pill s-won">Sent</span>':`<a class="btn btn-ghost btn-xs" target="_blank" rel="noopener" href="${h(link(l))}" data-act="camp-send" data-c="${c.id}" data-id="${l.id}">Send</a>`}</td></tr>`).join('')}</tbody></table></div>`, true);
}

/* ================================================================ EVENTS */
const A = {}; // click actions
A.close = () => closeLayer();
A.nav = async el => { $('#sidebar')?.classList.remove('open'); closeLayer(); if (el.dataset.page==='clients' && S.org){ S.org=''; go('clients'); await loadAll(); return; } go(el.dataset.page); };
A.menu = () => $('#sidebar').classList.toggle('open');
A.logout = async () => { await api.signOut(); S.me=null; S.org=''; closeLayer(); render(); };
A['demo-login'] = async el => { S.me = await api.demoLogin(el.dataset.id); S.page='dashboard'; await loadAll(); };
A['reset-demo'] = (el,e) => { e.preventDefault(); api.reset(); toast('Demo data reset'); render(); };
A['pick-org'] = async el => { closeLayer(); S.org = el.dataset.id; if (S.page==='clients') S.page='dashboard'; S.f.page=1; await loadAll(); };
A['add-lead'] = () => addLeadModal();
A['open-lead'] = (el,e) => { if (e.target.closest('[data-stop]')) return; openLead(el.dataset.id); };
A.fstatus = el => { S.f.status=el.dataset.v; S.f.page=1; render(); };
A.pg = el => { S.f.page += +el.dataset.d; render(); };
A.sel = el => { el.checked ? S.sel.add(el.dataset.id) : S.sel.delete(el.dataset.id); render(); };
A['sel-all'] = el => { const f=S.f; const rows=filteredLeads().slice((f.page-1)*f.size, f.page*f.size); rows.forEach(r=> el.checked ? S.sel.add(r.id) : S.sel.delete(r.id)); render(); };
A['bulk-clear'] = () => { S.sel.clear(); render(); };
A['bulk-delete'] = async el => { if(!await ask({ title:`Delete ${S.sel.size} leads?`, body:'They are removed permanently with their notes and history.', confirm:'Delete leads', danger:true })) return; await busy(null, async()=>{ await api.deleteLeads([...S.sel]); S.leads=S.leads.filter(l=>!S.sel.has(l.id)); toast(`${S.sel.size} leads deleted`); S.sel.clear(); render(); }); };
A['export-leads'] = () => { const L=filteredLeads(); download(`leads-${new Date().toISOString().slice(0,10)}.csv`, toCSV([['Name','Mobile','Email','City','Status','Owner','Source','Entry date','Next follow-up','Deal value'], ...L.map(l=>[l.name,l.phone,l.email,l.city,STATUS_LABEL[l.status],pname(l.assigned_to),l.source,fmtDT(l.created_at),l.next_followup?fmtDT(l.next_followup):'',l.deal_value||''])])); };
A['fu-tab'] = el => { S.fu=el.dataset.v; render(); };
A['log-call'] = el => logAct(el.dataset.id,'call','Called '+(S.leads.find(l=>l.id===el.dataset.id)?.phone||''));
A['log-wa'] = el => logAct(el.dataset.id,'whatsapp','Opened WhatsApp chat');
A['log-mail'] = el => logAct(el.dataset.id,'email','Opened email');
A['set-status'] = async el => { const v=el.dataset.v; const patch={status:v}; if(v==='follow_up' && !S.leads.find(l=>l.id===S.openLead)?.next_followup){ const d=new Date(); d.setDate(d.getDate()+1); d.setHours(11,0,0,0); patch.next_followup=d.toISOString(); }
  try { await patchLead(patch, v==='won' ? 'Marked as won. Add the deal value under Details.' : 'Status updated'); if(v==='won') $('[name=deal_value]')?.focus(); } catch(e){ toast(e.message,true); } };
A['fu-quick'] = async el => { const v=el.dataset.v; let d=new Date(); if(v==='2h') d=new Date(Date.now()+2*3600e3); else if(v==='tm'){ d.setDate(d.getDate()+1); d.setHours(11,0,0,0);} else if(v==='3d'){ d.setDate(d.getDate()+3); d.setHours(11,0,0,0);}
  try { await patchLead({ next_followup: v==='clear' ? null : d.toISOString() }, v==='clear'?'Follow-up cleared':'Follow-up set for '+fmtDT(d)); } catch(e){ toast(e.message,true); } };
A['add-note'] = async el => { const t=$('#note').value.trim(); if(!t) return; await busy(el, async()=>{ await api.addActivity(S.openLead,'note',t); const l=S.leads.find(x=>x.id===S.openLead); if(l) l.updated_at=new Date().toISOString(); toast('Note saved'); await openLead(S.openLead); }); };
A['use-paste'] = () => { const t=$('#paste').value; if(!t.trim()) return toast('Paste some rows first', true); startMapping(parseCSV(t)); };
A['sample-csv'] = () => download('sample-leads.csv', toCSV([['Name','Mobile','Email','City'],['Rahul Sharma','9876543210','rahul@gmail.com','New Delhi'],['Priya Verma','9812345678','priya@gmail.com','Gurugram'],['Amit Gupta','9898989898','','Noida']]));
A['up-back'] = () => { S.up={step:1}; render(); };
A['up-reset'] = () => { S.up={step:1}; render(); };
A['up-import'] = async el => {
  const u=S.up; if (u.map.phone==='' || u.map.phone==null) return toast('Please choose the Mobile column', true);
  const existing=new Set(scopedLeads().map(l=>String(l.phone||'').replace(/\D/g,'').slice(-10)).filter(Boolean)); const seen=new Set(); let skipped=0; const rows=[];
  for (const r of u.rows){ const m=mapRow(r); const key=m.phone.replace(/\D/g,'').slice(-10); if(!key && !m.email){ skipped++; continue; } if(u.dedupe && key && (existing.has(key)||seen.has(key))){ skipped++; continue; } seen.add(key); rows.push(m); }
  if (!rows.length) return toast('Nothing to import: all rows were duplicates or had no mobile number', true);
  await busy(el, async()=>{ const mode = u.mode==='one' ? (u.target||'auto') : u.mode; const leads = await api.insertLeads(curOrgId(), rows, mode);
    S.up = { step:3, result:{ leads, skipped } }; await refreshLeads(); S.orgs = await api.listOrgs(); render(); });
};
A['add-exec'] = () => execModal();
A['view-exec-leads'] = el => { S.f={ ...S.f, owner:el.dataset.id, status:'', q:'', range:'all', page:1 }; go('leads'); };
A['reset-pw'] = async el => { const p=await ask({ title:'Reset password', body:'New password for <b>'+h(pname(el.dataset.id))+'</b> (8+ characters). Share it with them after saving.', confirm:'Save password', input:genPw() }); if(!p) return; try { await api.resetPassword(el.dataset.id, p); toast('Password updated. Share it with them.'); } catch(e){ toast(e.message,true); } };
A.distribute = async el => busy(el, async()=>{ const n=await api.distributeUnassigned(curOrgId()); await refreshLeads(); S.orgs=await api.listOrgs(); toast(`${n} leads distributed`); render(); });
A['add-src'] = () => srcModal();
A['src-help'] = el => srcHelp(S.sources.find(s=>s.id===el.dataset.id));
A['del-src'] = async el => { if(!await ask({ title:'Remove this source?', body:'Its webhook URL stops working straight away. Leads already captured stay in the CRM.', confirm:'Remove source', danger:true })) return; await api.deleteSource(el.dataset.id); S.sources=S.sources.filter(s=>s.id!==el.dataset.id); render(); };
A['test-src'] = async el => busy(el, async()=>{ const s=S.sources.find(x=>x.id===el.dataset.id); const fn=['Test','Demo','Sample'][Math.floor(Math.random()*3)];
  await api.simulateWebhook(s, { name:fn+' Lead '+Math.floor(Math.random()*900+100), phone:'9'+Math.floor(100000000+Math.random()*899999999), city:'New Delhi' }); await refreshLeads(); S.orgs=await api.listOrgs();
  const l=S.leads.filter(x=>x.source===s.name).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0]; toast(`Test lead received → assigned to ${pname(l?.assigned_to)}`); render(); });
A.copy = el => { navigator.clipboard?.writeText(el.dataset.v).then(()=>toast('Copied'), ()=>toast('Copy failed', true)); };
A['new-camp'] = () => campModal();
A['open-camp'] = el => campView(S.campaigns.find(c=>c.id===el.dataset.id));
A['camp-send'] = async el => { const c=S.campaigns.find(x=>x.id===el.dataset.c); const ids=new Set(c.audience.sent_ids||[]); ids.add(el.dataset.id); c.audience={...c.audience, sent_ids:[...ids]}; c.sent=ids.size; if(ids.size>=c.total) c.status='sent'; else c.status='sending';
  try { await api.updateCampaign(c.id, { audience:c.audience, sent:c.sent, status:c.status }); await api.addActivity(el.dataset.id, c.channel==='email'?'email':'whatsapp', `Campaign “${c.name}” sent via ${c.channel}`); } catch(e){ toast(e.message,true); }
  setTimeout(()=>campView(c), 300); };
A['camp-export'] = el => { const c=S.campaigns.find(x=>x.id===el.dataset.id); const L=(c.audience.ids||[]).map(id=>S.leads.find(l=>l.id===id)).filter(Boolean); download(`campaign-${c.name.replace(/\W+/g,'-')}.csv`, toCSV([['Name','Mobile','Email','Message'], ...L.map(l=>[l.name,l.phone,l.email,fillMsg(c.message,l)])])); };
A['camp-del'] = async el => { if(!await ask({ title:'Delete this campaign?', body:'The leads stay. Only the campaign and its send progress are removed.', confirm:'Delete campaign', danger:true })) return; await api.deleteCampaign(el.dataset.id); S.campaigns=S.campaigns.filter(c=>c.id!==el.dataset.id); closeLayer(); render(); };
A['export-rep'] = () => download('executive-report.csv', toCSV([['Executive','Leads','Open','Worked','Interested','Follow-up','Won','Lost','Conversion %','Overdue','Won value'], ...(S._repRows||[]).map(r=>[r.e.full_name,r.n,r.open,r.worked,r.int,r.fu,r.won,r.lost,pct(r.won,r.n),r.od,r.val])]));
A['add-client'] = () => clientModal();
A['edit-client'] = el => clientModal(S.orgs.find(o=>o.id===el.dataset.id));

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName==='SELECT' || el.type==='checkbox' || el.type==='radio' || el.type==='file' || el.type==='datetime-local') return; // handled on change
  if (el.tagName==='A' && el.getAttribute('href')==='#') e.preventDefault();
  if (el.tagName!=='A' && el.tagName!=='LABEL' && el.type!=='checkbox') e.preventDefault();
  if (el.closest('[data-stop]') && el.dataset.act==='open-lead') return;
  if (el.closest('tr[data-act="open-lead"]') && el !== el.closest('tr')) e.stopPropagation();
  fn(el, e);
});
document.addEventListener('change', async e => {
  const el=e.target; const act=el.dataset.act;
  if (el.dataset.f) { S.f[el.dataset.f] = el.dataset.f==='size' ? +el.value : el.value; S.f.page=1; render(); return; }
  if (el.dataset.upMap) { S.up.map[el.dataset.upMap] = el.value; render(); return; }
  if (el.dataset.up) { S.up[el.dataset.up] = el.type==='checkbox' ? el.checked : el.value; render(); return; }
  if (el.dataset.lead==='assigned_to') { try { await patchLead({ assigned_to: el.value||null }, 'Lead re-assigned'); } catch(err){ toast(err.message,true); } return; }
  if (!act) return;
  if (act==='sel' || act==='sel-all') return A[act](el, e);
  if (act==='ws') { S.org=el.value; S.f.page=1; S.sel.clear(); S.up={step:1}; await loadAll(); return; }
  if (act==='file' && el.files[0]) return readFile(el.files[0]);
  if (act==='bulk-assign' && el.value) { const ids=[...S.sel]; try { for (const id of ids) { const u=await api.updateLead(id,{assigned_to:el.value}); Object.assign(S.leads.find(l=>l.id===id), u); } toast(`${ids.length} leads assigned to ${pname(el.value)}`); S.sel.clear(); render(); } catch(err){ toast(err.message,true); } return; }
  if (act==='bulk-status' && el.value) { const ids=[...S.sel]; try { for (const id of ids) { const u=await api.updateLead(id,{status:el.value}); Object.assign(S.leads.find(l=>l.id===id), u); } toast(`${ids.length} leads updated`); S.sel.clear(); render(); } catch(err){ toast(err.message,true); } return; }
  if (act==='fu-set' && el.value) { try { await patchLead({ next_followup:new Date(el.value).toISOString() }, 'Follow-up saved'); } catch(err){ toast(err.message,true); } return; }
  if (act==='toggle-auto') { const o=curOrg(); try { await api.updateOrg(o.id,{auto_assign:el.checked}); o.auto_assign=el.checked; toast('Auto-distribution '+(el.checked?'on':'off')); render(); } catch(err){ toast(err.message,true); } return; }
  if (act==='toggle-user') { try { await api.setActive(el.dataset.id, el.checked); person(el.dataset.id).active=el.checked; toast(el.checked?'Executive activated':'Executive deactivated'); render(); } catch(err){ toast(err.message,true); el.checked=!el.checked; } return; }
  if (act==='toggle-org') { try { await api.updateOrg(el.dataset.id,{active:el.checked}); S.orgs.find(o=>o.id===el.dataset.id).active=el.checked; render(); } catch(err){ toast(err.message,true); } return; }
  if (act==='toggle-src') { try { await api.updateSource(el.dataset.id,{active:el.checked}); S.sources.find(s=>s.id===el.dataset.id).active=el.checked; } catch(err){ toast(err.message,true); } return; }
  if (act==='rep-range') { S.rep=el.value; render(); return; }
  if (act==='camp-aud') return updAud();
});
let qT; document.addEventListener('input', e => { if (e.target.dataset.f==='q') { clearTimeout(qT); const v=e.target.value; qT=setTimeout(()=>{ S.f.q=v; S.f.page=1; render(); const i=$('[data-f="q"]'); if(i){ i.focus(); i.setSelectionRange(v.length,v.length);} }, 250); } });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeLayer(); });
document.addEventListener('dragover', e => { const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); d.classList.add('drag'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('#drop')?.classList.remove('drag'); });
document.addEventListener('drop', e => { const d=e.target.closest?.('#drop'); if(d){ e.preventDefault(); d.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) readFile(f); } });

document.addEventListener('submit', async e => {
  const f=e.target; const kind=f.dataset.form; if(!kind) return; e.preventDefault();
  if (kind==='ask'){ const m=f.closest('.modal'); const r=m._res; m._res=null; const v=$('#ask-in') ? $('#ask-in').value : true; closeLayer(); r && r(v); return; }
  const d=Object.fromEntries(new FormData(f)); const btn=f.querySelector('[type=submit]');
  if (kind==='login') return busy(btn, async()=>{ S.me = await api.signIn(d.email.trim(), d.password); S.page=(location.hash.replace(/^#\/?/,'')||'dashboard'); await loadAll(); });
  if (kind==='add-lead') return busy(btn, async()=>{ const mode = isExec() ? 'auto' : (d.owner||'auto'); const [l] = await api.insertLeads(curOrgId(), [{ name:d.name, phone:d.phone.replace(/[^\d+]/g,''), email:d.email, city:d.city, source:d.source||'Manual', notes:d.notes }], mode);
    if (d.notes) await api.addActivity(l.id,'note',d.notes); await refreshLeads(); S.orgs=await api.listOrgs(); closeLayer(); toast(l.assigned_to ? `Lead added → ${pname(l.assigned_to)}` : 'Lead added (unassigned)'); render(); });
  if (kind==='lead-details') return busy(btn, async()=>{ await patchLead({ name:d.name, phone:d.phone, email:d.email||null, city:d.city||null, deal_value: d.deal_value===''?null:+d.deal_value }, 'Details saved'); });
  if (kind==='add-exec') return busy(btn, async()=>{ await api.createExecutive({ ...d, org_id:curOrgId() }); S.profiles = await api.listProfiles(isSuper()?'':curOrgId()); closeLayer(); toast(`Login created for ${d.full_name}`); render();
    openModal(`<h3>Login ready ✓</h3><p class="muted">Share these details with <b>${h(d.full_name)}</b>:</p><div class="code" style="margin:12px 0">${h(`CRM link: ${location.href.split('#')[0]}\nEmail:    ${d.email}\nPassword: ${d.password}`)}</div><div class="modal-f"><button class="btn btn-ghost" data-act="copy" data-v="${h(`CRM link: ${location.href.split('#')[0]}\nEmail: ${d.email}\nPassword: ${d.password}`)}">Copy</button><button class="btn btn-primary" data-act="close">Done</button></div>`); });
  if (kind==='add-client') return busy(btn, async()=>{ const o = await api.createClient(d); closeLayer(); toast(`${d.company} created`); await loadAll();
    openModal(`<h3>${h(d.company)} is ready ✓</h3><p class="muted">Send these login details to <b>${h(d.contact_name)}</b>. They can add their sales team from <i>Team</i>.</p><div class="code" style="margin:12px 0">${h(`CRM link: ${location.href.split('#')[0]}\nEmail:    ${d.email}\nPassword: ${d.password}`)}</div><div class="modal-f"><button class="btn btn-ghost" data-act="copy" data-v="${h(`CRM link: ${location.href.split('#')[0]}\nEmail: ${d.email}\nPassword: ${d.password}`)}">Copy</button><button class="btn btn-primary" data-act="pick-org" data-id="${o.id}">Open workspace →</button></div>`); });
  if (kind==='edit-client') return busy(btn, async()=>{ await api.updateOrg(f.dataset.id, { name:d.name, plan:d.plan, max_executives:+d.max_executives, contact_name:d.contact_name, phone:d.phone }); S.orgs=await api.listOrgs(); closeLayer(); toast('Client updated'); render(); });
  if (kind==='add-src') return busy(btn, async()=>{ const s=await api.createSource(curOrgId(), d.name, d.kind); S.sources.push(s); closeLayer(); render(); srcHelp(s); });
  if (kind==='add-camp') return busy(btn, async()=>{ const L=audienceOf(d); if(!L.length) throw new Error('No leads match this audience');
    const c = await api.createCampaign({ org_id:curOrgId(), name:d.name, channel:d.channel, subject:d.subject||null, message:d.message, audience:{ status:d.status, source:d.source, owner:d.owner, ids:L.map(l=>l.id), sent_ids:[] }, total:L.length });
    S.campaigns.unshift(c); closeLayer(); render(); campView(c); });
});

/* ================================================================ BOOT */
(async function boot(){
  $('#app').innerHTML = '<div class="spinner"></div>';
  const p = location.hash.replace(/^#\/?/,'');
  try { S.me = await api.session(); } catch(e){ S.me=null; }
  if (S.me) { if (p) S.page=p; await loadAll(); } else render();
  window.addEventListener('hashchange', () => { const p=location.hash.replace(/^#\/?/,''); if (S.me && p && p!==S.page){ S.page=p; closeLayer(); render(); } });
})();
</script>
